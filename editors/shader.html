<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nijimi · GLSL 工作台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      background: #0b0910; color: #e8ddc8; font-size: 12.5px;
    }
    #viewport { position: absolute; inset: 0; }
    #viewport canvas { display: block; }

    .cmyk {
      position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 5;
      background: linear-gradient(90deg, #00a5c8, #c800a5, #a5c800, #3a3a3a);
      opacity: 0.75;
    }

    .panel {
      position: absolute; z-index: 10;
      background: rgba(20, 17, 26, 0.94); border: 1px solid #3a3348;
      border-radius: 8px; padding: 12px 14px 10px;
      backdrop-filter: blur(6px); overflow-y: auto;
    }
    .panel h2 {
      font-size: 11px; letter-spacing: 0.14em; color: #b8a888; font-weight: 600;
      border-bottom: 1px dashed #3a3348; padding-bottom: 7px; margin-bottom: 8px;
    }
    #hud { left: 16px; top: 26px; width: 300px; }
    #hud .line { display: flex; justify-content: space-between; gap: 10px; margin: 4px 0; font-size: 11px; }
    #hud .line span:first-child { color: #7a7062; }
    #hud .line span:last-child { color: #cfc4ae; font-variant-numeric: tabular-nums; }
    #hud .ok { color: #7fb36a !important; }
    #hud .bad { color: #d4695f !important; }

    #right { right: 16px; top: 16px; width: 300px; max-height: calc(100% - 32px); }

    .group { border-top: 1px dashed #3a3348; margin-top: 9px; padding-top: 8px; }
    .group:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
    .group .title { font-size: 10px; color: #7a7062; letter-spacing: 0.12em; margin-bottom: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chips button {
      background: #241f2e; color: #cfc4ae; border: 1px solid #4a4258;
      border-radius: 4px; padding: 4px 9px; font: inherit; font-size: 10.5px; cursor: pointer;
    }
    .chips button.on { border-color: #e8a34c; color: #e8a34c; }
    .chips button:hover { border-color: #6a6280; }

    .row { display: flex; align-items: center; gap: 7px; margin: 6px 0; }
    .row label { flex: 0 0 96px; color: #9a8f7e; font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
    .row input[type="range"] { flex: 1; accent-color: #e8a34c; height: 3px; min-width: 0; }
    .row input[type="color"] {
      flex: 0 0 34px; height: 18px; padding: 0; border: 1px solid #4a4258;
      border-radius: 3px; background: #241f2e; cursor: pointer;
    }
    .row .val { flex: 0 0 46px; text-align: right; color: #e8a34c; font-variant-numeric: tabular-nums; font-size: 10.5px; }

    #notices { margin-top: 8px; font-size: 10px; line-height: 1.6; color: #8d8494; max-height: 92px; overflow-y: auto; }
    #notices div { border-left: 2px solid #4a4258; padding-left: 6px; margin-bottom: 4px; }
    #notices div.warn { border-color: #e8a34c; color: #c9b58c; }

    #editor {
      left: 16px; bottom: 16px; width: min(600px, calc(100% - 350px));
      height: 286px; display: flex; flex-direction: column; padding-bottom: 10px;
    }
    #editor .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex: 0 0 auto; }
    #editor .head .tabs { display: flex; gap: 4px; }
    #editor .head button {
      background: #241f2e; color: #cfc4ae; border: 1px solid #4a4258;
      border-radius: 4px; padding: 3px 9px; font: inherit; font-size: 10.5px; cursor: pointer;
    }
    #editor .head button.on { border-color: #e8a34c; color: #e8a34c; }
    #editor .head button.primary { border-color: #7fb36a; color: #a9d193; }
    #editor .head .spacer { flex: 1; }
    #editor .head .hint { color: #6a6272; font-size: 10px; }

    #declBox { flex: 0 0 auto; margin-bottom: 6px; font-size: 10px; color: #7a7062; }
    #declBox summary { cursor: pointer; user-select: none; }
    #declBox pre {
      margin-top: 5px; padding: 6px 8px; background: #16131d; border: 1px dashed #3a3348;
      border-radius: 4px; color: #9fb08f; max-height: 76px; overflow: auto; white-space: pre;
    }

    #errors {
      flex: 0 0 auto; margin-bottom: 6px; padding: 7px 9px; max-height: 88px; overflow: auto;
      background: #2a1518; border: 1px solid #6d2f2f; border-radius: 4px;
      color: #e79b93; font-size: 10.5px; white-space: pre-wrap;
    }
    #code {
      flex: 1 1 auto; width: 100%; resize: none; min-height: 0;
      background: #14111a; color: #d8e0c8; border: 1px solid #3a3348; border-radius: 4px;
      padding: 8px 9px; font: inherit; font-size: 11.5px; line-height: 1.55;
      tab-size: 2; white-space: pre; overflow: auto;
    }
    #code:focus { outline: none; border-color: #6a6280; }
  </style>
</head>
<body>
  <div class="cmyk"></div>
  <div id="viewport"></div>

  <div class="panel" id="hud">
    <h2>GLSL 工作台</h2>
    <div class="line"><span>材质</span><span id="hudMat">—</span></div>
    <div class="line"><span>队列</span><span id="hudQueue">—</span></div>
    <div class="line"><span>编译</span><span id="hudCompile">—</span></div>
    <div class="line"><span>programs</span><span id="hudPrograms">—</span></div>
    <div class="line"><span>fps</span><span id="hudFps">—</span></div>
    <div class="line"><span>uTime</span><span id="hudTime">—</span></div>
    <p style="margin-top:8px;font-size:10px;line-height:1.7;color:#6a6272">
      层 B 材质：声明式 uniform → 自动生成 <code>uniform</code> 行。改完 ⌘/Ctrl + Enter 热编译。
    </p>
  </div>

  <div class="panel" id="right">
    <h2>样例 / 参数</h2>
    <div class="group">
      <div class="title">材质</div>
      <div class="chips" id="matChips"></div>
    </div>
    <div class="group">
      <div class="title">参数（写进 ParamBus）</div>
      <div id="params"></div>
    </div>
    <div class="group">
      <div class="title">notice</div>
      <div id="notices"><div>—</div></div>
    </div>
  </div>

  <div class="panel" id="editor">
    <div class="head">
      <div class="tabs">
        <button data-tab="frag" class="on">片元</button>
        <button data-tab="vert">顶点</button>
      </div>
      <div class="spacer"></div>
      <span class="hint" id="editorHint">frag</span>
      <button id="apply" class="primary">应用 ⌘↵</button>
      <button id="undo">回退上一版</button>
      <button id="revert">还原初始</button>
    </div>
    <details id="declBox">
      <summary>自动生成的 uniform 声明（<span id="declCount">0</span> 行，拼在你的源码前面）</summary>
      <pre id="decls"></pre>
    </details>
    <pre id="errors" hidden></pre>
    <textarea id="code" spellcheck="false"></textarea>
  </div>

  <script type="module" src="/editors/shader.ts"></script>
</body>
</html>
